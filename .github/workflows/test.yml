name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on:
      - self-hosted
      - Linux
    # Dockerfile bilan bir xil Go versiyasi: testlar deploy qilinadigan binardan
    # boshqa toolchain'da o'tib ketmasligi kerak.
    container:
      image: golang:1.25.1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Cache Go modules and build cache
        uses: actions/cache@v4
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run tests
        run: make test
