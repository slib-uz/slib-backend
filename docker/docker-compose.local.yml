services:


  postgres:
    image: postgres:17
    container_name: slib-postgres-db
    ports:
      - "5433:5432"
    env_file:
      - ../env/.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    #      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./.volumes/pg_data:/var/lib/postgresql/data
    networks:
      - shared_network


  redis:
    image: redis:7.4-alpine
    command: redis-server
    container_name: slib-redis-queue
    ports:
      - "6379:6379"
#    volumes:
#      - ./.volumes/redis:/data
    networks:
      - shared_network


  redisinsight:
    image: redis/redisinsight:latest
    container_name: slib-redis-insight
    ports:
      - "5540:5540"
#    volumes:
#      - ./.volumes/redisinsight:/data
    depends_on:
      - redis
    networks:
      - shared_network



networks:
  shared_network:
    driver: bridge
